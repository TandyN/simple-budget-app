    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Simple Budget</title>
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var target = event && event.target;
          if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK')) return;
          try {
            if (sessionStorage.getItem('simple-budget-asset-reload') === '1') return;
            sessionStorage.setItem('simple-budget-asset-reload', '1');
            var cleanCaches =
              'caches' in window
                ? caches.keys().then(function (keys) {
                    return Promise.all(
                      keys
                        .filter(function (k) {
                          return k.indexOf('simple-budget-') === 0;
                        })
                        .map(function (k) {
                          return caches.delete(k);
                        }),
                    );
                  })
                : Promise.resolve();
            var cleanSw =
              'serviceWorker' in navigator
                ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(
                      regs.map(function (r) {
                        return r.unregister();
                      }),
                    );
                  })
                : Promise.resolve();
            Promise.all([cleanCaches, cleanSw]).finally(function () {
              window.location.reload();
            });
          } catch (_) {
            window.location.reload();
          }
        },
        true,
      );
    </script>
    <script type="module" crossorigin src="./assets/index-QHu7Apsu.js"></script>

    <div id="root"></div>
  </body>
