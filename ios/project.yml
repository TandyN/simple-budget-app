name: SimpleBudget
options:
  bundleIdPrefix: io.github.tandyn
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: SimpleBudget/Info.plist
targets:
  SimpleBudget:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SimpleBudget
        excludes:
          - "www/**"
      - path: SimpleBudget/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tandyn.simplebudget
        PRODUCT_NAME: SimpleBudget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
