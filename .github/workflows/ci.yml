name: PR Verification & Preview QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR branch is up to date with main
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main "${{ github.event.pull_request.head.sha }}"; then
            echo "✗ This PR branch is behind origin/main. Rebase or merge origin/main so all changes are tested together." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check documentation accuracy
        run: pnpm run docs:check

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm run test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps webkit chromium

      - name: Run end-to-end journeys
        run: pnpm run test:e2e

      - name: Build production bundle
        run: pnpm run build

      - name: Deploy isolated PR preview & run Live PWA QA
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_URL: https://tandyn.github.io/simple-budget-app/pr-${{ github.event.pull_request.number }}/
        run: |
          bash scripts/deploy.sh --pr "${{ github.event.pull_request.number }}"
          node scripts/verify-live.mjs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  ios-simulator:
    needs: verify
    if: github.event.action != 'closed'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Native iOS App (Simulator)
        run: pnpm run ios:build -- --simulator

      - name: Upload compiled iOS Simulator .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleBudget-iOS-Simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/SimpleBudget.app
          retention-days: 7

  cleanup-pr-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove closed PR preview from gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/deploy.sh --cleanup-pr "${{ github.event.pull_request.number }}"
