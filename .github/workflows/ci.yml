name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Lint and format check
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests with coverage
        run: pnpm test

      - name: Build production bundle
        run: pnpm run build

      - name: Verify post-build security and privacy gates
        run: pnpm run verify:gates

      - name: Run Playwright E2E tests (Phase 4A+)
        shell: bash
        run: |
          if [ -d e2e ] && [ -n "$(find e2e -type f -name '*.spec.ts' -print -quit)" ]; then
            pnpm exec playwright install --with-deps chromium webkit
            pnpm run test:e2e
          else
            echo "No e2e/**/*.spec.ts files found; skipping Playwright E2E until Phase 4A."
          fi

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
